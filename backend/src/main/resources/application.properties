# ── Application ─────────────────────────────────────────────────────────────
spring.application.name=sih26123-backend
server.port=8080

# ── SQLite datasource (local dev) ────────────────────────────────────────────
# To switch to Postgres: change these three lines + remove sqlite-jdbc dependency
spring.datasource.url=jdbc:sqlite:./sih26123.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Python simulation engine (SimulationClient target) ───────────────────────
simulation.engine.url=http://localhost:8001
simulation.engine.connect-timeout-ms=2000
simulation.engine.read-timeout-ms=5000

# ── WebSocket ────────────────────────────────────────────────────────────────
# /ws/live is the live-update feed consumed by the dashboard.
# Configured in LiveUpdateWebSocketHandler — no extra properties needed here.
