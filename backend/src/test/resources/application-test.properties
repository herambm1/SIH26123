# Test profile — isolated SQLite file, recreated on every test JVM run.
spring.datasource.url=jdbc:sqlite:./target/sih26123-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

simulation.engine.url=http://localhost:8001
simulation.engine.connect-timeout-ms=500
simulation.engine.read-timeout-ms=500
