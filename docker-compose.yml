# docker-compose.yml — optional, for demo-day convenience
# Owner: Member 6
#
# Services:
#   simulation  — Python FastAPI control server (port 8001)
#   backend     — Java Spring Boot backend (port 8080)
#
# The dashboard runs via `npm run dev` in local development.
# To bundle it into compose for a single-command demo day, see docs/06_BACKEND.md §8.8.
#
# Usage:
#   docker-compose up
#
# NOTE on the simulation Dockerfile's location: the original placeholder here
# pointed at simulation/Dockerfile, but simulation/ is outside Member 6's
# ownership boundary for this task (must-not-modify). Rather than add a file
# inside another member's directory, the Dockerfile lives at
# docker/simulation.Dockerfile (new, Member-6-owned directory) and is built
# with the repo root as context — it only COPYs simulation/ (and its sibling
# packages), it does not change anything inside it.

version: "3.9"

services:
  simulation:
    build:
      context: .
      dockerfile: docker/simulation.Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "simulation.runner"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/sih26123.db
      - SIMULATION_ENGINE_URL=http://simulation:8001
    depends_on:
      - simulation
